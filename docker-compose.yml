name: case17

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: case17-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-case17}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-case17}   # без .env — как DB_DSN по умолчанию (api/app/config.py); порт базы наружу не публикуется
      POSTGRES_DB: ${POSTGRES_DB:-case17}
      EMBED_DIM: ${EMBED_DIM:-512}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m
    shm_size: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-case17} -d ${POSTGRES_DB:-case17}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [case17net]

  api:
    build:
      # Контекст — корень репозитория: образу нужны api/ и weights/clean_student_a10_ep28.pt
      # (.dockerignore — белый список). Стадия weights в api/Dockerfile берёт веса оттуда,
      # если это настоящий файл (git lfs pull), иначе качает по WEIGHTS_URL; sha256 сверяется всегда.
      context: .
      dockerfile: api/Dockerfile
      args:
        EMBED_MODEL: ${EMBED_MODEL:-reid:vit_base_patch16_siglip_224.webli}
        WEIGHTS_URL: ${WEIGHTS_URL:-}
    image: case17-api:local
    container_name: case17-api
    restart: unless-stopped
    # Requires NVIDIA container runtime. Not ignored on a CPU-only host — там: -f docker-compose.cpu.yml.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_DSN: postgresql://${POSTGRES_USER:-case17}:${POSTGRES_PASSWORD:-case17}@db:5432/${POSTGRES_DB:-case17}
      EMBED_MODEL: ${EMBED_MODEL:-reid:vit_base_patch16_siglip_224.webli}
      EMBED_DIM: ${EMBED_DIM:-512}
      INPUT_SIZE: ${INPUT_SIZE:-224}
      EMBED_TTA_FLIP: ${EMBED_TTA_FLIP:-0}
      SEARCH_TOP_N: ${SEARCH_TOP_N:-10}
      # Режим отказа: формула оценки и порог. Числа по умолчанию — только в
      # api/app/config.py (одно место); пустая переменная = значение оттуда.
      # Строгую точку тоже пробрасываем: иначе переключатель в вебе
      # показывает не тот порог, что стоит в .env.
      # Режим отказа и постобработка: production-значения — только в api/app/config.py
      # (одно место); пустая переменная = значение оттуда (docs/refusal.md).
      REFUSAL_SCORE: ${REFUSAL_SCORE:-}
      SEARCH_THRESHOLD: ${SEARCH_THRESHOLD:-}
      SEARCH_THRESHOLD_STRICT: ${SEARCH_THRESHOLD_STRICT:-}
      PP_DBA_K: ${PP_DBA_K:-}
      PP_CAMERA_PENALTY: ${PP_CAMERA_PENALTY:-}
      PP_CAMERA_TAU: ${PP_CAMERA_TAU:-}
      PP_CAMERA_TOPK: ${PP_CAMERA_TOPK:-}
      PP_DEDUP: ${PP_DEDUP:-}
      PP_DEDUP_RANK: ${PP_DEDUP_RANK:-}
      PP_DEDUP_REFUSAL: ${PP_DEDUP_REFUSAL:-}
      PP_DEDUP_SIM_ANY: ${PP_DEDUP_SIM_ANY:-}
      PP_DEDUP_SIM: ${PP_DEDUP_SIM:-}
      PP_DEDUP_IOU: ${PP_DEDUP_IOU:-}
      PP_DEDUP_CENTER: ${PP_DEDUP_CENTER:-}
      PP_DEDUP_SIZE: ${PP_DEDUP_SIZE:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      DATA_DIR: /data
      ARTIFACTS_DIR: /artifacts
      OMP_NUM_THREADS: "2"
      HF_HUB_OFFLINE: "1"
      HF_HOME: /opt/hfcache
      REID_WEIGHTS: ${REID_WEIGHTS:-/opt/weights/clean_student_a10_ep28.pt}   # в образе (api/Dockerfile)
      # Ожидаемый sha256 весов: при старте сверяется и пишется в лог; пусто — только записать.
      REID_WEIGHTS_SHA256: ${REID_WEIGHTS_SHA256:-}
      # Режим кропа для чекпоинтов, которые не пишут tf_mode в args (студент).
      # Без проброса загрузчик возьмёт timm(base)-кроп и squash-модель
      # потеряет ~2 mAP. См. api/app/models/reid_checkpoint.py.
      REID_TF_MODE: ${REID_TF_MODE:-squash}
    volumes:
      - ${DATA_HOST_DIR:-./data}:/data:ro
      # только для своих весов (REID_WEIGHTS=/models/<файл>); веса a10 — в образе
      - ${MODELS_HOST_DIR:-./weights}:/models:ro
      - ./artifacts:/artifacts
    ports:
      - "8000:8000"
    mem_limit: ${API_MEM_LIMIT:-1536m}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: ${API_START_PERIOD:-90s}
    networks: [case17net]

  web:
    build: ./web
    image: case17-web:local
    container_name: case17-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"
    mem_limit: 64m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [case17net]

volumes:
  db_data:

networks:
  case17net:
    driver: bridge
